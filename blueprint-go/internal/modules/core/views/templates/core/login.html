{{define "title"}}{{T "Login"}} - Blueprint{{end}}

{{define "content"}}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-cube fa-3x text-primary mb-3"></i>
                        <h2 class="card-title">{{T "Login"}}</h2>
                        <p class="text-muted">{{T "Sign in to your account"}}</p>
                    </div>

                    <form method="POST" action="/login">
                        <input type="hidden" name="next" value="{{.next}}">

                        <div class="mb-3">
                            <label for="email" class="form-label">{{T "Email"}}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="you@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">{{T "Password"}}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-sign-in-alt me-2"></i>{{T "Login"}}
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0">
                            {{T "Don't have an account?"}}
                            <a href="/register">{{T "Register"}}</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
