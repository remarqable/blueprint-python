{{define "title"}}{{T "Register"}} - Blueprint{{end}}

{{define "content"}}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-cube fa-3x text-primary mb-3"></i>
                        <h2 class="card-title">{{T "Create Account"}}</h2>
                        <p class="text-muted">{{T "Join Blueprint today"}}</p>
                    </div>

                    <form method="POST" action="/register">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label">{{T "First Name"}}</label>
                                <input type="text" class="form-control" id="first_name" name="first_name"
                                       placeholder="John" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label">{{T "Last Name"}}</label>
                                <input type="text" class="form-control" id="last_name" name="last_name"
                                       placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">{{T "Email"}}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="you@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">{{T "Password"}}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="••••••••" minlength="6" required>
                            </div>
                            <div class="form-text">{{T "At least 6 characters"}}</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">{{T "Confirm Password"}}</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                       placeholder="••••••••" minlength="6" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fa-solid fa-user-plus me-2"></i>{{T "Create Account"}}
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0">
                            {{T "Already have an account?"}}
                            <a href="/login">{{T "Login"}}</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
