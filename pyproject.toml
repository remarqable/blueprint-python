[project]
name = "flask-blueprint"
version = "2.0.0"
description = "Documentation blueprint for production-ready Flask SaaS applications"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Core
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Login",
    "Flask-Migrate",
    "SQLAlchemy",
    # Utilities
    "structlog",
    "python-dotenv",
    # Production server
    "gunicorn",
    # --- Optional: add as needed ---
    # "psycopg[binary]",   # PostgreSQL driver (database: postgres)
    # "Flask-Limiter",     # rate limiting beyond the in-memory limiter
    # "Flask-Dance",       # OAuth providers (core/auth.md)
]

# Dev-only tools: installed by `uv sync` locally, excluded on the server
# by `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "types-Flask",
    "ruff",
]

# This is an application, not an installable package -- uv manages the
# environment without trying to build/install the project itself.
[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# The SQLAlchemy mypy plugin is deprecated as of SQLAlchemy 2.0 -- native
# Mapped[] annotations replace it. Do not re-add it.

[[tool.mypy.overrides]]
module = ["flask_login.*", "flask_sqlalchemy.*", "flask_migrate.*", "structlog.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
